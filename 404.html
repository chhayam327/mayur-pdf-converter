<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I ❤️ PDF TOOLKIT</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#f8fafc;
  --text:#0f172a;
}
.dark{
  --bg:#020617;
  --text:#f1f5f9;
}
body{
  font-family:'Plus Jakarta Sans',sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
  transition:0.3s;
}

/* ===== Glass Ultra ===== */
.glass{
  backdrop-filter: blur(25px);
  background: rgba(255,255,255,0.55);
  border:1px solid rgba(255,255,255,0.25);
  box-shadow:0 20px 50px rgba(0,0,0,0.08);
}
.dark .glass{
  background: rgba(15,23,42,0.6);
}

/* ===== Cards ===== */
.card{
  transition:0.4s;
  position:relative;
  overflow:hidden;
}
.card:hover{
  transform:translateY(-10px) scale(1.03);
  box-shadow:0 30px 60px rgba(0,0,0,0.15);
}

/* shine */
.card::after{
  content:"";
  position:absolute;
  top:0;left:-100%;
  width:100%;height:100%;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,0.6),transparent);
  transition:0.6s;
}
.card:hover::after{left:100%;}

/* ===== Ripple ===== */
.ripple{
  position:absolute;
  border-radius:50%;
  transform:scale(0);
  background:rgba(255,255,255,0.6);
  animation:ripple 0.6s linear;
}
@keyframes ripple{
  to{transform:scale(5); opacity:0;}
}

/* ===== Cursor glow ===== */
.cursor{
  width:250px;height:250px;
  position:fixed;
  background:radial-gradient(circle,rgba(229,50,46,0.2),transparent);
  pointer-events:none;
  transform:translate(-50%,-50%);
}

/* ===== Blob ===== */
.blob{
  position:absolute;
  width:350px;height:350px;
  background:rgba(229,50,46,0.15);
  filter:blur(120px);
  animation:float 12s infinite alternate;
}
@keyframes float{
  from{transform:translateY(0);}
  to{transform:translateY(100px);}
}

/* ===== Fade ===== */
.fade{
  animation:fade 0.5s ease;
}
@keyframes fade{
  from{opacity:0;transform:translateY(10px);}
  to{opacity:1;}
}

/* ===== Sidebar ===== */
.sidebar{
  position:fixed;
  top:0;left:-280px;
  width:280px;height:100%;
  transition:0.4s;
  transform:scale(0.95);
}
.sidebar.active{
  left:0;
  transform:scale(1);
}

/* ===== Skeleton ===== */
.skeleton{
  height:80px;
  border-radius:12px;
  background:linear-gradient(90deg,#eee,#ddd,#eee);
  animation:shimmer 1.2s infinite;
}
@keyframes shimmer{
  0%{background-position:-200px;}
  100%{background-position:200px;}
}

/* ===== Button press ===== */
button:active{
  transform:scale(0.96);
}

/* ===== Circle ===== */
.circle{
  stroke-dasharray:283;
  stroke-dashoffset:283;
  transition:1s linear;
}

/* ===== Processing dots ===== */
.dots::after{
  content:"...";
  animation:dots 1s infinite;
}
@keyframes dots{
  0%{content:".";}
  50%{content:"..";}
  100%{content:"...";}
}
</style>
</head>

<body>

<div class="cursor" id="cursor"></div>

<!-- NAVBAR -->
<header class="glass fixed top-0 w-full p-4 flex justify-between z-50">
<button onclick="toggleSidebar()">☰</button>
<h1 class="font-bold">I ❤️ PDF TOOLKIT</h1>
<button onclick="toggleDark()">🌙</button>
</header>

<!-- SIDEBAR -->
<div id="sidebar" class="glass sidebar p-6">
<h2 class="font-bold mb-4">Menu</h2>
<ul class="space-y-3">
<li onclick="goHome()">Home</li>
<li onclick="openPremium()">Premium</li>
</ul>
</div>

<div id="overlay" onclick="toggleSidebar()" class="hidden fixed inset-0 bg-black/30"></div>

<div class="pt-20 px-4 max-w-md mx-auto relative">

<!-- BLOBS -->
<div class="blob top-0 left-0"></div>
<div class="blob bottom-0 right-0"></div>

<!-- HERO -->
<section class="text-center py-10 fade">
<h2 class="text-2xl font-bold">All PDF tools in one place</h2>
<p class="text-sm opacity-70">Ultra smooth. Ultra premium.</p>
</section>

<!-- LOADING -->
<div id="loading" class="space-y-3">
<div class="skeleton"></div>
<div class="skeleton"></div>
<div class="skeleton"></div>
</div>

<!-- TOOLS -->
<div id="tools" class="hidden space-y-4">

<div onclick="openTool(event,'Merge PDF')" class="glass card p-4 rounded-xl cursor-pointer flex justify-between">
<span>Merge PDF</span><span>→</span>
</div>

<div onclick="openTool(event,'Split PDF')" class="glass card p-4 rounded-xl cursor-pointer flex justify-between">
<span>Split PDF</span><span>→</span>
</div>

<div onclick="openTool(event,'Compress PDF')" class="glass card p-4 rounded-xl cursor-pointer flex justify-between">
<span>Compress PDF</span><span>→</span>
</div>

</div>

<!-- CONVERTER -->
<div id="converter" class="hidden mt-6 fade">
<h2 id="title" class="font-bold mb-4"></h2>

<div onclick="startProcess()" 
class="border-2 border-dashed p-6 rounded-xl text-center cursor-pointer hover:border-[#E5322E] transition">

<p class="opacity-70">Drag & Drop File</p>
<button class="mt-3 bg-[#E5322E] text-white px-4 py-2 rounded-lg">
Upload
</button>

</div>

</div>

<!-- PROCESS -->
<div id="process" class="hidden text-center mt-6 fade">

<svg width="120" height="120" class="mx-auto">
<circle cx="60" cy="60" r="45" stroke="#eee" stroke-width="10" fill="none"/>
<circle id="circle" cx="60" cy="60" r="45" stroke="#E5322E" stroke-width="10" fill="none" class="circle"/>
</svg>

<p id="time">10s</p>
<p class="dots opacity-70">Processing</p>

</div>

<!-- DOWNLOAD -->
<div id="download" class="hidden text-center mt-6 fade">
<button onclick="confettiEffect()" class="bg-[#E5322E] text-white px-6 py-3 rounded-xl">
Download
</button>
</div>

<!-- PREMIUM -->
<div id="premium" class="hidden mt-6 fade">

<h2 class="text-xl font-bold mb-4">Premium Plans</h2>

<div class="space-y-4">

<div class="glass p-4 rounded-xl">
Free - ₹0
</div>

<div class="glass p-4 rounded-xl border-2 border-[#E5322E]">
Pro - ₹199
</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
// Cursor
document.addEventListener("mousemove",(e)=>{
cursor.style.left=e.clientX+"px";
cursor.style.top=e.clientY+"px";
});

// Loading
setTimeout(()=>{
loading.style.display="none";
tools.classList.remove("hidden");
},1500);

// Sidebar
function toggleSidebar(){
sidebar.classList.toggle("active");
overlay.classList.toggle("hidden");
}

// Dark
function toggleDark(){
document.body.classList.toggle("dark");
}

// Nav
function goHome(){
tools.classList.remove("hidden");
premium.classList.add("hidden");
converter.classList.add("hidden");
}
function openPremium(){
tools.classList.add("hidden");
premium.classList.remove("hidden");
}

// Tool open
function openTool(e,name){
let r=document.createElement("span");
r.classList.add("ripple");
r.style.left=e.offsetX+"px";
r.style.top=e.offsetY+"px";
e.currentTarget.appendChild(r);
setTimeout(()=>r.remove(),600);

tools.classList.add("hidden");
converter.classList.remove("hidden");
title.innerText=name;
}

// Process
function startProcess(){
converter.classList.add("hidden");
process.classList.remove("hidden");

let t=10;
let i=setInterval(()=>{
t--;
time.innerText=t+"s";
let p=(10-t)/10;
circle.style.strokeDashoffset=283-(283*p);

if(t<=0){
clearInterval(i);
process.classList.add("hidden");
download.classList.remove("hidden");
}
},1000);
}

// Confetti
function confettiEffect(){
confetti({particleCount:150,spread:80});
}
</script>

</body>
  </html>
